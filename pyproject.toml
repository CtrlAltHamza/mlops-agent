[project]
name = "mlops-agent"
version = "1.0.0"
description = "Production-style MLOps agent for dataset, experiment, workflow, and cluster operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.6",
    "httpx>=0.27",
    "mlflow>=2.18",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "kubernetes>=31.0",
    "dvc>=3.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "training"]
